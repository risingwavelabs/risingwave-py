name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LOCKED: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync environment
        run: |
          uv sync --extra udf

      - name: Run checks
        run: |
          uv run ruff format --check risingwave tests
          uv run ruff check risingwave tests
          uv run pytest -q

      - name: Build package
        run: |
          uv build

      - name: Verify build artifacts
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          sdist = next(Path("dist").glob("*.tar.gz"))
          wheel = next(Path("dist").glob("*.whl"))
          with tarfile.open(sdist) as archive:
              sdist_files = archive.getnames()
          with zipfile.ZipFile(wheel) as archive:
              wheel_files = archive.namelist()
          assert any(name.endswith("/examples/image_udfs.py") for name in sdist_files)
          assert any(
              name.endswith("/examples/cpu_inference_udfs.py")
              for name in sdist_files
          )
          assert not any(name.startswith("examples/") for name in wheel_files)
          assert any(name == "risingwave/udf/server.py" for name in wheel_files)
          PY
